name: Allure Report Pages

on:
  push:
    branches:
      - feature/lab5-testing
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Allure Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests with Allure
        run: uv run --no-sync --no-build pytest -v

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate Allure HTML Report
        run: |
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output /tmp/allure.tgz https://github.com/allure-framework/allure2/releases/download/2.46.1/allure-2.46.1.tgz
          mkdir -p /tmp/allure-cli
          tar -xzf /tmp/allure.tgz -C /tmp/allure-cli
          /tmp/allure-cli/allure-2.46.1/bin/allure generate allure-results --clean -o allure-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: allure-report/

  deploy:
    name: Deploy Allure Report
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
