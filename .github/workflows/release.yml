name: Release on Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Read version from code
        id: version
        run: |
          VERSION=$(python -c "import runpy; print(runpy.run_path('src/git_rest_lab2/__init__.py')['__version__'])")
          echo "Version from code: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Python package
        run: |
          python -m build

      - name: Generate SHA-256 checksums
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Read release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          pattern = rf"(?ms)^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, changelog)

          if not match:
              raise SystemExit(
                  f"CHANGELOG.md does not contain section for version {version}"
              )

          notes = match.group(0).strip() + "\n"
          Path("release_notes.md").write_text(notes, encoding="utf-8")

          print(notes)
          PY

      - name: Create tag and GitHub Release
        uses: ./.github/actions/create-release
        with:
          version: ${{ steps.version.outputs.version }}
          notes-file: release_notes.md
          assets: "dist/*"